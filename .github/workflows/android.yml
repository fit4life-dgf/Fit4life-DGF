name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'mobile/**', 'package.json', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://zwiifeyqkeivkyssfzfu.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_P8702RqV_xtYa5kBn-LFPA_Rb1Mzom7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build web app
        run: npm install && npm run build
      - name: Create Android project
        working-directory: mobile
        run: npm install && npm run add:android
      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fit4life-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
